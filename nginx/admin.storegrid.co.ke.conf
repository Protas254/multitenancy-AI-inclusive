# ==============================================================================
# Host Nginx Configuration for Contabo VPS (Project 3: StoreGrid Admin)
# File: /etc/nginx/sites-available/admin.storegrid.co.ke.conf
#
# Proxies to isolated Docker backend container:
#   storegrid_backend -> http://127.0.0.1:8003
#   Root / redirects directly to /admin/
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.storegrid.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.storegrid.co.ke;

    # SSL Certificate Paths (managed by Certbot on host)
    ssl_certificate /etc/letsencrypt/live/admin.storegrid.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.storegrid.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 25M;

    # Root of admin.storegrid.co.ke automatically redirects to /admin/
    location = / {
        return 302 /admin/;
    }

    # Proxy admin and static/media requests to StoreGrid backend container
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
