# ==============================================================================
# Nginx Configuration for storegrid.co.ke
# Single Domain Setup:
# - Frontend SPA: Served statically from /var/www/storegrid/client/dist
# - Backend API:  Proxied to Django/Gunicorn at 127.0.0.1:8000 (/api/ and /admin/)
# ==============================================================================

# 1. Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name storegrid.co.ke www.storegrid.co.ke;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name storegrid.co.ke www.storegrid.co.ke;

    # SSL Certificate Paths (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/storegrid.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storegrid.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size (for product images / receipt attachments)
    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Root directory for Vite SPA production build
    root /var/www/storegrid/client/dist;
    index index.html;

    # Django API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Django Admin Reverse Proxy
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static Files (collected via manage.py collectstatic)
    location /static/ {
        alias /var/www/storegrid/server/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Django Media Uploads (receipts, logos, avatar images)
    location /media/ {
        alias /var/www/storegrid/server/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Service Worker and PWA Manifest (no-cache for quick updates)
    location ~* (sw\.js|sw-push\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static Assets Cache (Vite hashed bundles)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA Fallback (HTML5 History API)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
