# ============================================================
# StoreGrid — Docker Compose (Production for Contabo VPS)
# Project: StoreGrid (Multi-tenant Retail Business Cloud)
# Isolated for multi-project VPS environments
# ============================================================

name: storegrid

services:

  # ── Django Backend (Port 8003) ─────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: storegrid_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - media_data:/app/media
      - sqlite_data:/app/db_data
    ports:
      - "127.0.0.1:8003:8000"
    networks:
      - storegrid_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Vite SPA + Web Server (Port 3003) ──────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: storegrid_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - storegrid_net

# ── Isolated Named Volumes ─────────────────────────────────
volumes:
  media_data:
    name: storegrid_media
  sqlite_data:
    name: storegrid_sqlite

# ── Isolated Internal Network ──────────────────────────────
networks:
  storegrid_net:
    name: storegrid_network
    driver: bridge
